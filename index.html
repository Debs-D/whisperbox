<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhisperBox</title>
  <script>
    const _t = localStorage.getItem('wb_theme');
    if (_t === 'light') document.documentElement.dataset.theme = 'light';
  </script>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <div id="auth-view" class="view">
    <div class="auth-bg"></div>
    <div class="auth-container">
      <div class="auth-logo">
        <div class="logo-mark">
          <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="40" height="40" rx="12" fill="#6d28d9"/>
            <path d="M20 8C15.6 8 12 11.6 12 16v2H10c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h20c1.1 0 2-.9 2-2V20c0-1.1-.9-2-2-2h-2v-2c0-4.4-3.6-8-8-8zm0 3.1c2.7 0 4.9 2.2 4.9 4.9v2h-9.8v-2c0-2.7 2.2-4.9 4.9-4.9zm0 12.4c1.1 0 2 .9 2 2s-.9 2-2 2-2-.9-2-2 .9-2 2-2z" fill="white"/>
          </svg>
        </div>
        <h1>WhisperBox</h1>
        <p>Only you and them.</p>
      </div>

      <div class="auth-tabs">
        <button class="tab-btn active" id="login-tab">Sign In</button>
        <button class="tab-btn" id="register-tab">Create Account</button>
      </div>

      <form id="login-form" class="auth-form">
        <div class="form-group">
          <label for="login-username">Username</label>
          <input type="text" id="login-username" placeholder="your_username" autocomplete="username" spellcheck="false">
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password">
        </div>
        <button type="submit" class="btn-primary" id="login-btn">
          <span>Sign In</span>
        </button>
        <p class="error-msg" id="login-error"></p>
      </form>

      <form id="register-form" class="auth-form hidden">
        <div class="form-group">
          <label for="reg-username">Username</label>
          <input type="text" id="reg-username" placeholder="pick_a_username" autocomplete="username" spellcheck="false">
        </div>
        <div class="form-group">
          <label for="reg-displayname">Display Name</label>
          <input type="text" id="reg-displayname" placeholder="Your Name" autocomplete="name">
        </div>
        <div class="form-group">
          <label for="reg-password">Password</label>
          <input type="password" id="reg-password" placeholder="At least 8 characters" autocomplete="new-password">
        </div>
        <div class="form-group">
          <label for="reg-confirm">Confirm Password</label>
          <input type="password" id="reg-confirm" placeholder="Repeat password" autocomplete="new-password">
        </div>
        <button type="submit" class="btn-primary" id="register-btn">
          <span>Create Account</span>
        </button>
        <p class="error-msg" id="register-error"></p>
      </form>

      <p class="auth-footer">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM12 17c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
        End-to-end encrypted
      </p>
    </div>
  </div>

  <div id="app-view" class="view hidden">

    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="current-user" id="open-profile" title="Your profile">
          <div class="avatar" id="current-user-avatar"></div>
          <span id="current-user-name" class="current-user-name"></span>
        </div>
        <div class="header-actions">
          <button class="icon-btn" id="new-chat-btn" title="New conversation">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
              <line x1="12" y1="8" x2="12" y2="14"/><line x1="9" y1="11" x2="15" y2="11"/>
            </svg>
          </button>
          <button class="icon-btn" id="theme-toggle" title="Toggle theme"></button>
          <button class="icon-btn" id="logout-btn" title="Log out">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
              <polyline points="16 17 21 12 16 7"/>
              <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="sidebar-search">
        <div class="search-input-wrap">
          <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input type="text" id="search-input" placeholder="Search…" autocomplete="off" spellcheck="false">
        </div>
      </div>

      <div id="search-results" class="search-results hidden"></div>
      <div id="conversations-list" class="conversations-list"></div>
    </aside>

    <main class="main-content">

      <div id="empty-state" class="empty-state">
        <div class="empty-lock">
          <svg width="56" height="56" viewBox="0 0 24 24" fill="none">
            <rect width="24" height="24" rx="6" fill="rgba(109,40,217,0.15)"/>
            <path d="M17 11h-1V8c0-2.21-1.79-4-4-4S8 5.79 8 8v3H7c-.55 0-1 .45-1 1v7c0 .55.45 1 1 1h10c.55 0 1-.45 1-1v-7c0-.55-.45-1-1-1zm-5 6c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm1.6-4.5H10.4V8c0-.88.72-1.6 1.6-1.6s1.6.72 1.6 1.6v4.5z" fill="#8b5cf6"/>
          </svg>
        </div>
        <h2>WhisperBox</h2>
        <p>Pick a conversation or find someone to chat with.</p>
        <div class="e2ee-pill">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2z"/></svg>
          End-to-end encrypted
        </div>
      </div>

      <div id="chat-view" class="chat-view hidden">
        <header class="chat-header">
          <div class="chat-peer">
            <div class="avatar large" id="chat-peer-avatar"></div>
            <div class="chat-peer-meta">
              <span id="chat-peer-name"></span>
              <div style="display:flex;align-items:center;gap:8px">
                <span class="e2ee-label">
                  <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2z"/></svg>
                  Encrypted
                </span>
                <span id="peer-online-status" class="peer-online-badge hidden">Online</span>
              </div>
            </div>
          </div>
        </header>

        <div class="messages-scroll" id="messages-scroll">
          <div class="messages-list" id="messages-list"></div>
        </div>

        <footer class="composer">
          <div class="emoji-picker hidden" id="emoji-picker">
            <div class="emoji-cats" id="emoji-cats"></div>
            <div class="emoji-grid" id="emoji-grid"></div>
          </div>
          <div class="composer-inner">
            <button class="composer-action" id="emoji-btn" title="Emoji">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <path d="M8 14s1.5 2 4 2 4-2 4-2"/>
                <line x1="9" y1="9" x2="9.01" y2="9"/>
                <line x1="15" y1="9" x2="15.01" y2="9"/>
              </svg>
            </button>
            <button class="composer-action" id="attach-btn" title="Send image">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/>
                <polyline points="21 15 16 10 5 21"/>
              </svg>
            </button>
            <textarea
              id="message-input"
              placeholder="Message"
              rows="1"
              autocomplete="off"
              spellcheck="true"
            ></textarea>
            <button class="send-btn" id="send-btn" disabled title="Send">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"/>
                <polygon points="22 2 15 22 11 13 2 9 22 2"/>
              </svg>
            </button>
          </div>
          <input type="file" id="media-input" accept="image/*" hidden>
        </footer>
      </div>

    </main>
  </div>

  <div class="modal-overlay hidden" id="new-chat-modal">
    <div class="modal-box">
      <div class="modal-head">
        <h3>New Chat</h3>
        <button class="icon-btn" id="close-modal">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-search-wrap">
        <input type="text" id="modal-search-input" placeholder="Search by name or username…" autocomplete="off" spellcheck="false">
      </div>
      <div id="modal-search-results" class="modal-results"></div>
    </div>
  </div>

  <div class="modal-overlay hidden" id="logout-modal">
    <div class="modal-box confirm-box">
      <div class="confirm-body">
        <div class="confirm-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </div>
        <h3 class="confirm-title">Log out?</h3>
        <p class="confirm-desc">You'll need to sign back in to continue.</p>
      </div>
      <div class="confirm-actions">
        <button class="confirm-btn-cancel" id="logout-cancel">Cancel</button>
        <button class="confirm-btn-danger" id="logout-confirm">Log out</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay hidden" id="profile-modal">
    <div class="modal-box profile-box">
      <div class="profile-hero">
        <button class="icon-btn profile-close-btn" id="close-profile">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
        <div class="profile-avatar-wrap" id="profile-avatar-wrap" title="Change photo">
          <div class="avatar profile-avatar" id="profile-avatar"></div>
          <div class="avatar-edit-overlay">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
              <circle cx="12" cy="13" r="4"/>
            </svg>
          </div>
        </div>
        <input type="file" id="pfp-input" accept="image/*" hidden>
        <div class="profile-display-name" id="profile-display-name"></div>
        <div class="profile-username-label" id="profile-username-label"></div>
      </div>
      <div class="profile-body">
        <div class="profile-row">
          <span class="profile-row-label">Joined</span>
          <span class="profile-row-value" id="profile-joined"></span>
        </div>
        <div class="profile-row">
          <span class="profile-row-label">Messages</span>
          <span class="profile-row-value">End-to-end encrypted</span>
        </div>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>

  <div id="loading-overlay" class="loading-overlay hidden">
    <div class="loading-card">
      <div class="spinner"></div>
      <p id="loading-message">Loading…</p>
    </div>
  </div>

  <script src="js/crypto.js"></script>
  <script src="js/api.js"></script>
  <script src="js/store.js"></script>
  <script src="js/socket.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
